<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="src/ui/styles/root.css">
    <link rel="stylesheet" href="src/ui/styles/theme.css">
    <link rel="stylesheet" href="src/ui/styles/main_menu.css">
    <link rel="stylesheet" href="src/ui/styles/dialogs.css">
    <link rel="stylesheet" href="src/ui/styles/ksp2_panels.css">
    <link rel="stylesheet" href="src/ui/styles/tracking.css">
    <link rel="stylesheet" href="src/ui/styles/flight.css">
    <link rel="stylesheet" href="src/ui/styles/ship_builder.css">
    <link rel="stylesheet" href="src/ui/styles/facility.css">
    <link rel="stylesheet" href="src/ui/styles/scenes.css">
    <link rel="stylesheet" href="src/ui/styles/esc_menu.css">
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; background: black; width: 100%; height: 100%; }

        /* 启动加载画面 */
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #loadingTitle {
            color: #fff;
            font-family: monospace;
            font-size: 28px;
            margin-bottom: 40px;
            text-align: center;
        }
        #loadingLogBox {
            width: 500px;
            height: 280px;
            background: rgba(0,0,0,0.85);
            border: 1px solid #333;
            border-radius: 3px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .loading-log-ok {
            color: #88ccff;
        }
        .loading-log-fail {
            color: #ff6666;
        }
        #loadingProgressBarOuter {
            width: 500px;
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        #loadingProgressBarInner {
            height: 100%;
            width: 0%;
            background: #88ccff;
            transition: width 0.15s ease;
        }
        #loadingProgressText {
            color: #fff;
            font-family: monospace;
            font-size: 14px;
        }
        /* 音频加载进度条 */
        #loadingAudioProgressBarOuter {
            width: 500px;
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        #loadingAudioProgressBarInner {
            height: 100%;
            width: 0%;
            background: #66ff88;
            transition: width 0.15s ease;
        }
        #loadingAudioProgressText {
            color: #fff;
            font-family: monospace;
            font-size: 14px;
        }
        /* 字体加载进度条 */
        #loadingFontProgressBarOuter {
            width: 500px;
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        #loadingFontProgressBarInner {
            height: 100%;
            width: 0%;
            background: #ffcc66;
            transition: width 0.15s ease;
        }
        #loadingFontProgressText {
            color: #fff;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- 启动加载画面 -->
    <div id="loadingScreen">
        <div id="loadingTitle">首次启动 游戏正在加载图片、音频与字体 请耐心等待</div>
        <div id="loadingLogBox">
            <div id="loadingLogContent"></div>
        </div>
        <div id="loadingProgressBarOuter">
            <div id="loadingProgressBarInner"></div>
        </div>
        <div id="loadingProgressText">0/0 (0%)</div>
        <div id="loadingAudioProgressBarOuter">
            <div id="loadingAudioProgressBarInner"></div>
        </div>
        <div id="loadingAudioProgressText">0/0 (0%)</div>
        <div id="loadingFontProgressBarOuter">
            <div id="loadingFontProgressBarInner"></div>
        </div>
        <div id="loadingFontProgressText">0/0 (0%)</div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
