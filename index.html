<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="src/ui/styles/root.css">
    <link rel="stylesheet" href="src/ui/styles/theme.css">
    <link rel="stylesheet" href="src/ui/styles/main_menu.css">
    <link rel="stylesheet" href="src/ui/styles/dialogs.css">
    <link rel="stylesheet" href="src/ui/styles/ksp2_panels.css">
    <link rel="stylesheet" href="src/ui/styles/tracking.css">
    <link rel="stylesheet" href="src/ui/styles/flight.css">
    <link rel="stylesheet" href="src/ui/styles/ship_builder.css">
    <link rel="stylesheet" href="src/ui/styles/facility.css">
    <link rel="stylesheet" href="src/ui/styles/scenes.css">
    <link rel="stylesheet" href="src/ui/styles/esc_menu.css">
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; background: black; width: 100%; height: 100%; }

        /* ============================================================
           启动加载画面（0.2.7 KSP2 视觉：蓝灰面板壳 + 黑底卡片 + 提示分区）
           引用 root.css / theme.css 变量；main.js 仅依赖各 id 不变
           ============================================================ */
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            /* 回退字体：字体加载完成后不引起界面尺寸变化 */
            font-family: monospace;
        }

        /* 面板壳：蓝灰底 + 紫描边（与三大面板统一） */
        #loadingScreen .loading-panel {
            width: 560px;
            background: var(--theme-bg);
            border: 1px solid var(--theme-menu-border);
            border-radius: 5px;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 面板头：紫头条（与分组卡头一致） */
        #loadingScreen .loading-card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--theme-btn-selected);
            color: var(--text-bright);
            font-size: 14px;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 提示分区：耐心等待提示（深底圆角块） */
        #loadingScreen .loading-hint {
            margin: 14px 14px 0 14px;
            padding: 10px 14px;
            background: var(--theme-panel-deep);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }

        /* 卡片：与提示栏同色（深底圆角） */
        #loadingScreen .loading-card {
            margin: 14px;
            background: var(--theme-panel-deep);
            border-radius: 4px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 日志区：黑底卡内更深底 */
        #loadingLogBox {
            height: 200px;
            background: var(--theme-panel-deep);
            border-radius: 4px;
            overflow-y: auto;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.7;
            box-sizing: border-box;
        }
        .loading-log-ok {
            color: var(--accent);
        }
        .loading-log-fail {
            color: var(--danger);
        }

        /* 进度组：标签 + 条 + 数字 */
        #loadingScreen .loading-progress-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #loadingScreen .loading-progress-label {
            color: var(--text-dim);
            font-size: 10px;
            letter-spacing: 1px;
        }
        #loadingScreen .loading-progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #loadingScreen .loading-progress-track {
            flex: 1;
            height: 8px;
            background: var(--theme-panel-deep);
            border-radius: 4px;
            overflow: hidden;
        }
        #loadingScreen .loading-progress-track > div {
            height: 100%;
            width: 0%;
            transition: width 0.15s ease;
        }
        /* 三条进度条：资源蓝 / 音频绿 / 字体金 */
        #loadingProgressBarInner { background: var(--accent); }
        #loadingAudioProgressBarInner { background: var(--progress-green); }
        #loadingFontProgressBarInner { background: var(--ut-gold); }
        #loadingScreen .loading-progress-text {
            width: 90px;
            flex-shrink: 0;
            color: var(--text-mid);
            font-size: 11px;
            text-align: right;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- 启动加载画面（面板壳 + 提示分区 + 黑底卡片；id 供 main.js 更新，勿改） -->
    <div id="loadingScreen">
        <div class="loading-panel">
            <div class="loading-card-head">// 启动加载</div>
            <div class="loading-hint">首次启动 游戏正在加载图片、音频与字体 请耐心等待</div>
            <div class="loading-card">
                <div id="loadingLogBox">
                    <div id="loadingLogContent"></div>
                </div>
                <div class="loading-progress-group">
                    <div class="loading-progress-label">资源加载</div>
                    <div class="loading-progress-row">
                        <div class="loading-progress-track">
                            <div id="loadingProgressBarInner"></div>
                        </div>
                        <div id="loadingProgressText" class="loading-progress-text">0/0 (0%)</div>
                    </div>
                </div>
                <div class="loading-progress-group">
                    <div class="loading-progress-label">音频加载</div>
                    <div class="loading-progress-row">
                        <div class="loading-progress-track">
                            <div id="loadingAudioProgressBarInner"></div>
                        </div>
                        <div id="loadingAudioProgressText" class="loading-progress-text">0/0 (0%)</div>
                    </div>
                </div>
                <div class="loading-progress-group">
                    <div class="loading-progress-label">字体加载</div>
                    <div class="loading-progress-row">
                        <div class="loading-progress-track">
                            <div id="loadingFontProgressBarInner"></div>
                        </div>
                        <div id="loadingFontProgressText" class="loading-progress-text">0/0 (0%)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
